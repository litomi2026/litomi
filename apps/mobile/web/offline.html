<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#120d12" />
    <title>리토미 연결 오류</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
        background: #120d12;
        color: #f8f3ec;
        text-align: center;
      }

      main {
        max-width: 320px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }

      p {
        margin: 0 0 24px;
        color: #d6cbd0;
        line-height: 1.6;
      }

      button {
        border: 1px solid #6d5962;
        border-radius: 12px;
        padding: 12px 18px;
        background: #2b2025;
        color: #f8f3ec;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>연결할 수 없습니다</h1>
      <p>네트워크 연결을 확인한 뒤 다시 시도해 주세요.</p>
      <button type="button" onclick="window.location.reload()">다시 시도</button>
    </main>
  </body>
</html>
