services:
  app-postgres:
    image: postgres:18-alpine
    container_name: litomi-app-postgres
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: app_db
    ports:
      - '5434:5432'
    volumes:
      - app-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_user -d app_db']
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-postgres:
    image: postgres:18-alpine
    container_name: litomi-catalog-postgres
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: catalog_db
    ports:
      - '5435:5432'
    volumes:
      - catalog-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_user -d catalog_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # Chat message store. The schema is vanilla Postgres, so a local Postgres gives full parity for dev.
  chat-postgres:
    image: postgres:18-alpine
    container_name: litomi-chat-postgres
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: chat_db
    ports:
      - '5436:5432'
    volumes:
      - chat-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_user -d chat_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:9
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data

  # Dedicated Pub/Sub Valkey — separate instance, so broadcast fan-out can't contend with latency-sensitive cache traffic.
  redis-pubsub:
    image: valkey/valkey:9
    ports:
      - '6381:6379'
    volumes:
      - redis-pubsub-data:/data

  # Kafka-compatible broker for local development (the Chat event pipeline), no auth.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: litomi-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - '9092:9092'
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app-db-data:
  catalog-db-data:
  chat-db-data:
  redis-data:
  redis-pubsub-data:
  redpanda-data:
