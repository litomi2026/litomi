name: Backend Integration

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-integration:
    name: Backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      BACKEND_INTEGRATION_POSTGRES_URL: postgresql://test_user:test_password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/litomi_backend_integration_test
      UPSTASH_KV_REST_API_TOKEN: local_dev_token
      UPSTASH_KV_REST_API_URL: http://127.0.0.1:${{ job.services.srh.ports['80'] }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U test_user -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432/tcp

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      srh:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: local_dev_token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 80/tcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wait for Redis HTTP bridge
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "${UPSTASH_KV_REST_API_URL}/ping?token=${UPSTASH_KV_REST_API_TOKEN}" >/dev/null; then
              exit 0
            fi

            sleep 1
          done

          echo "Redis HTTP bridge did not become ready in time" >&2
          exit 1

      - name: Run backend integration tests
        run: bun run test:backend:integration
