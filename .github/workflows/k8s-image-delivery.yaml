name: Kubernetes Image Delivery

on:
  push:
    branches: [main, stage]
    # Skip k8s-only changes to avoid rebuilding images for manifest-only commits.
    paths-ignore:
      - 'k8s/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: kubernetes-image-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish-web-image:
    name: Build and publish web image
    if: ${{ github.ref_name == 'main' || github.ref_name == 'stage' }}
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.resolve_published_web_digest.outputs.digest }}
    env:
      OVERLAY_DIR: ${{ github.ref_name == 'main' && 'k8s/apps/litomi/overlays/prod' || github.ref_name == 'stage' && 'k8s/apps/litomi/overlays/stg' || '' }}
      IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/litomi-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Load public web build arguments from overlay
        id: load_public_env
        shell: bash
        run: |
          set -euo pipefail
          public_env_file="${OVERLAY_DIR}/public.env.kv"
          kustomization_file="${OVERLAY_DIR}/kustomization.yaml"

          if [ ! -f "$public_env_file" ]; then
            echo "public.env.kv not found: $public_env_file" >&2
            exit 1
          fi

          if [ ! -f "$kustomization_file" ]; then
            echo "kustomization.yaml not found: $kustomization_file" >&2
            exit 1
          fi

          extract_common_env() {
            local key="$1"
            local value=""

            while IFS= read -r line; do
              if [[ "$line" =~ ^[[:space:]]*-[[:space:]]*${key}= ]]; then
                value="${line#*=}"
                break
              fi
            done < "$kustomization_file"

            if [ -z "$value" ]; then
              echo "$key literal not found in $kustomization_file" >&2
              exit 1
            fi

            printf '%s' "$value"
          }

          app_origin="$(extract_common_env APP_ORIGIN)"
          vapid_public_key="$(extract_common_env VAPID_PUBLIC_KEY)"

          tmp="$(mktemp)"
          while IFS= read -r line; do
            if [[ "$line" =~ ^(#|[[:space:]]*$) ]]; then
              continue
            fi

            if [[ ! "$line" =~ ^NEXT_PUBLIC_[A-Z0-9_]+=.*$ ]]; then
              echo "public.env.kv must contain only NEXT_PUBLIC_* assignments, blank lines, or comments." >&2
              echo "$line" >&2
              exit 1
            fi

            if [[ "$line" == NEXT_PUBLIC_APP_ORIGIN=* || "$line" == NEXT_PUBLIC_VAPID_PUBLIC_KEY=* ]]; then
              echo "${line%%=*} is derived from kustomization.yaml and must not be set in public.env.kv." >&2
              exit 1
            fi

            printf '%s\n' "$line" >> "$tmp"
          done < "$public_env_file"

          if [ ! -s "$tmp" ]; then
            echo "No NEXT_PUBLIC_* entries found in $public_env_file" >&2
            exit 1
          fi

          echo "build_args<<EOF" >> "$GITHUB_OUTPUT"
          echo "APP_ORIGIN=$app_origin" >> "$GITHUB_OUTPUT"
          echo "VAPID_PUBLIC_KEY=$vapid_public_key" >> "$GITHUB_OUTPUT"
          cat "$tmp" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate web image metadata
        id: metadata_web
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web image for production
        id: build_web_production
        if: ${{ github.ref_name == 'main' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            CI=true
            COMMIT_SHA=${{ github.sha }}
            ${{ steps.load_public_env.outputs.build_args }}
          secrets: |
            APP_POSTGRES_URL=${{ secrets.APP_POSTGRES_URL }}
            "APP_POSTGRES_CERTIFICATE=${{ secrets.APP_POSTGRES_CERTIFICATE }}"
            CATALOG_POSTGRES_URL=${{ secrets.CATALOG_POSTGRES_URL }}
            "CATALOG_POSTGRES_CERTIFICATE=${{ secrets.CATALOG_POSTGRES_CERTIFICATE }}"
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT_WEB }}
          tags: ${{ steps.metadata_web.outputs.tags }}
          labels: ${{ steps.metadata_web.outputs.labels }}

      - name: Build and publish web image for staging
        id: build_web_staging
        if: ${{ github.ref_name == 'stage' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            CI=true
            COMMIT_SHA=${{ github.sha }}
            ${{ steps.load_public_env.outputs.build_args }}
          secrets: |
            APP_POSTGRES_URL=${{ secrets.APP_POSTGRES_URL }}
            "APP_POSTGRES_CERTIFICATE=${{ secrets.APP_POSTGRES_CERTIFICATE }}"
            CATALOG_POSTGRES_URL=${{ secrets.CATALOG_POSTGRES_URL }}
            "CATALOG_POSTGRES_CERTIFICATE=${{ secrets.CATALOG_POSTGRES_CERTIFICATE }}"
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT_WEB }}
          tags: ${{ steps.metadata_web.outputs.tags }}
          labels: ${{ steps.metadata_web.outputs.labels }}

      - name: Resolve published web image digest
        id: resolve_published_web_digest
        shell: bash
        env:
          PRODUCTION_DIGEST: ${{ steps.build_web_production.outputs.digest }}
          STAGING_DIGEST: ${{ steps.build_web_staging.outputs.digest }}
        run: |
          set -euo pipefail

          digest="${PRODUCTION_DIGEST:-${STAGING_DIGEST:-}}"
          if [ -z "$digest" ]; then
            echo "Failed to resolve web image digest" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  build-and-publish-api-image:
    name: Build and publish api image
    if: ${{ github.ref_name == 'main' || github.ref_name == 'stage' }}
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build_api_image.outputs.digest }}
    env:
      IMAGE_API: ghcr.io/${{ github.repository_owner }}/litomi-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate api image metadata
        id: metadata_api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish api image
        id: build_api_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT_BACKEND }}
          tags: ${{ steps.metadata_api.outputs.tags }}
          labels: ${{ steps.metadata_api.outputs.labels }}

  build-and-publish-cataloger-image:
    name: Build and publish cataloger image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build_cataloger_image.outputs.digest }}
    env:
      IMAGE_CATALOGER: ghcr.io/${{ github.repository_owner }}/litomi-cataloger
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate cataloger image metadata
        id: metadata_cataloger
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_CATALOGER }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish cataloger image
        id: build_cataloger_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/cataloger/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata_cataloger.outputs.tags }}
          labels: ${{ steps.metadata_cataloger.outputs.labels }}

  update-staging-image-digests:
    name: Update staging image digests
    if: ${{ github.ref_name == 'stage' && github.event_name != 'pull_request' }}
    needs:
      - build-and-publish-web-image
      - build-and-publish-api-image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      OVERLAY_FILE: k8s/apps/litomi/overlays/stg/kustomization.yaml
      IMAGE_WEB_DIGEST: ${{ needs.build-and-publish-web-image.outputs.digest }}
      IMAGE_API_DIGEST: ${{ needs.build-and-publish-api-image.outputs.digest }}
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: stage

      - name: Update staging image digests
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["OVERLAY_FILE"])
          lines = path.read_text().splitlines(keepends=True)

          replacements = {
              "litomi-web": os.environ["IMAGE_WEB_DIGEST"],
              "litomi-api": os.environ["IMAGE_API_DIGEST"],
          }

          def update_image_digest(image_name: str, digest: str) -> None:
              start = next((index for index, line in enumerate(lines) if line.strip() == f"- name: {image_name}"), None)
              if start is None:
                  raise SystemExit(f"Failed to find image entry for {image_name} in {path}")

              end = next(
                  (index for index in range(start + 1, len(lines)) if lines[index].strip().startswith("- name: ")),
                  len(lines),
              )

              for index in range(start + 1, end):
                  if lines[index].lstrip().startswith(("digest:", "newTag:")):
                      lines[index] = f"    digest: {digest}\n"
                      return

              insert_at = next(
                  (index + 1 for index in range(start + 1, end) if lines[index].lstrip().startswith("newName:")),
                  None,
              )
              if insert_at is None:
                  raise SystemExit(f"Failed to find newName for {image_name} in {path}")

              lines.insert(insert_at, f"    digest: {digest}\n")

          for name, digest in replacements.items():
              if not digest:
                  raise SystemExit(f"Missing digest for {name}")
              update_image_digest(name, digest)

          path.write_text("".join(lines))
          PY

      - name: Commit staging image digest updates
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- "$OVERLAY_FILE"; then
            echo "Staging image digests are already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OVERLAY_FILE"
          git commit -m "chore(k8s): bump staging image digests"
          git push origin HEAD:stage

  propose-production-image-digests:
    name: Propose production image digests
    if: ${{ github.ref_name == 'main' && github.event_name != 'pull_request' }}
    needs:
      - build-and-publish-web-image
      - build-and-publish-api-image
      - build-and-publish-cataloger-image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      OVERLAY_FILE: k8s/apps/litomi/overlays/prod/kustomization.yaml
      IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/litomi-web
      IMAGE_API: ghcr.io/${{ github.repository_owner }}/litomi-api
      IMAGE_CATALOGER: ghcr.io/${{ github.repository_owner }}/litomi-cataloger
      IMAGE_WEB_DIGEST: ${{ needs.build-and-publish-web-image.outputs.digest }}
      IMAGE_API_DIGEST: ${{ needs.build-and-publish-api-image.outputs.digest }}
      IMAGE_CATALOGER_DIGEST: ${{ needs.build-and-publish-cataloger-image.outputs.digest }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Update production image digests
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["OVERLAY_FILE"])
          lines = path.read_text().splitlines(keepends=True)

          replacements = {
              "litomi-web": os.environ["IMAGE_WEB_DIGEST"],
              "litomi-api": os.environ["IMAGE_API_DIGEST"],
              "litomi-cataloger": os.environ["IMAGE_CATALOGER_DIGEST"],
          }

          def update_image_digest(image_name: str, digest: str) -> None:
              start = next((index for index, line in enumerate(lines) if line.strip() == f"- name: {image_name}"), None)
              if start is None:
                  raise SystemExit(f"Failed to find image entry for {image_name} in {path}")

              end = next(
                  (index for index in range(start + 1, len(lines)) if lines[index].strip().startswith("- name: ")),
                  len(lines),
              )

              for index in range(start + 1, end):
                  if lines[index].lstrip().startswith(("digest:", "newTag:")):
                      lines[index] = f"    digest: {digest}\n"
                      return

              insert_at = next(
                  (index + 1 for index in range(start + 1, end) if lines[index].lstrip().startswith("newName:")),
                  None,
              )
              if insert_at is None:
                  raise SystemExit(f"Failed to find newName for {image_name} in {path}")

              lines.insert(insert_at, f"    digest: {digest}\n")

          for name, digest in replacements.items():
              if not digest:
                  raise SystemExit(f"Missing digest for {name}")
              update_image_digest(name, digest)

          path.write_text("".join(lines))
          PY

      - name: Create or update production promotion PR
        id: create_production_pr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: ${{ env.OVERLAY_FILE }}
          branch: codex/production-image-digests
          delete-branch: true
          commit-message: 'chore(k8s): propose production image digests'
          title: 'chore(k8s): promote production image digests'
          body: |
            This PR updates the production overlay to the latest immutable image digests built from `main`.

            - Web: `${{ env.IMAGE_WEB }}@${{ env.IMAGE_WEB_DIGEST }}`
            - API: `${{ env.IMAGE_API }}@${{ env.IMAGE_API_DIGEST }}`
            - Cataloger: `${{ env.IMAGE_CATALOGER }}@${{ env.IMAGE_CATALOGER_DIGEST }}`
            - Source commit: `${{ github.sha }}`
            - Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          base: main

      - name: Report production promotion PR
        if: ${{ steps.create_production_pr.outputs.pull-request-url }}
        shell: bash
        run: |
          echo "Created or updated production promotion PR: ${{ steps.create_production_pr.outputs.pull-request-url }}"
