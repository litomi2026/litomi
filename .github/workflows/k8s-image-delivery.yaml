name: Kubernetes Image Delivery

on:
  push:
    branches: [main]
    # Skip k8s-only changes to avoid rebuilding images for manifest-only commits.
    paths-ignore:
      - 'k8s/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubernetes-image-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish-web-image:
    name: Build and publish web image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build_web_image.outputs.digest }}
    env:
      OVERLAY_DIR: k8s/apps/litomi/overlays/prod
      IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/litomi-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Load public web build arguments from overlay
        id: load_public_env
        shell: bash
        run: |
          set -euo pipefail
          public_env_file="${OVERLAY_DIR}/public.env.kv"
          kustomization_file="${OVERLAY_DIR}/kustomization.yaml"

          if [ ! -f "$public_env_file" ]; then
            echo "public.env.kv not found: $public_env_file" >&2
            exit 1
          fi

          if [ ! -f "$kustomization_file" ]; then
            echo "kustomization.yaml not found: $kustomization_file" >&2
            exit 1
          fi

          extract_common_env() {
            local key="$1"
            local value=""

            while IFS= read -r line; do
              if [[ "$line" =~ ^[[:space:]]*-[[:space:]]*${key}= ]]; then
                value="${line#*=}"
                break
              fi
            done < "$kustomization_file"

            if [ -z "$value" ]; then
              echo "$key literal not found in $kustomization_file" >&2
              exit 1
            fi

            printf '%s' "$value"
          }

          app_origin="$(extract_common_env APP_ORIGIN)"
          vapid_public_key="$(extract_common_env VAPID_PUBLIC_KEY)"

          tmp="$(mktemp)"
          while IFS= read -r line; do
            if [[ "$line" =~ ^(#|[[:space:]]*$) ]]; then
              continue
            fi

            if [[ ! "$line" =~ ^NEXT_PUBLIC_[A-Z0-9_]+=.*$ ]]; then
              echo "public.env.kv must contain only NEXT_PUBLIC_* assignments, blank lines, or comments." >&2
              echo "$line" >&2
              exit 1
            fi

            if [[ "$line" == NEXT_PUBLIC_APP_ORIGIN=* || "$line" == NEXT_PUBLIC_VAPID_PUBLIC_KEY=* ]]; then
              echo "${line%%=*} is derived from kustomization.yaml and must not be set in public.env.kv." >&2
              exit 1
            fi

            printf '%s\n' "$line" >> "$tmp"
          done < "$public_env_file"

          if [ ! -s "$tmp" ]; then
            echo "No NEXT_PUBLIC_* entries found in $public_env_file" >&2
            exit 1
          fi

          echo "build_args<<EOF" >> "$GITHUB_OUTPUT"
          echo "APP_ORIGIN=$app_origin" >> "$GITHUB_OUTPUT"
          echo "VAPID_PUBLIC_KEY=$vapid_public_key" >> "$GITHUB_OUTPUT"
          cat "$tmp" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate web image metadata
        id: metadata_web
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web image
        id: build_web_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            CI=true
            COMMIT_SHA=${{ github.sha }}
            ${{ steps.load_public_env.outputs.build_args }}
          secrets: |
            APP_POSTGRES_URL=${{ secrets.APP_POSTGRES_URL }}
            "APP_POSTGRES_CERTIFICATE=${{ secrets.APP_POSTGRES_CERTIFICATE }}"
            CATALOG_POSTGRES_URL=${{ secrets.CATALOG_POSTGRES_URL }}
            "CATALOG_POSTGRES_CERTIFICATE=${{ secrets.CATALOG_POSTGRES_CERTIFICATE }}"
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT_WEB }}
          tags: ${{ steps.metadata_web.outputs.tags }}
          labels: ${{ steps.metadata_web.outputs.labels }}

  build-and-publish-api-image:
    name: Build and publish api image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build_api_image.outputs.digest }}
    env:
      IMAGE_API: ghcr.io/${{ github.repository_owner }}/litomi-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate api image metadata
        id: metadata_api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish api image
        id: build_api_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT_BACKEND }}
          tags: ${{ steps.metadata_api.outputs.tags }}
          labels: ${{ steps.metadata_api.outputs.labels }}

  build-and-publish-cataloger-image:
    name: Build and publish cataloger image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build_cataloger_image.outputs.digest }}
    env:
      IMAGE_CATALOGER: ghcr.io/${{ github.repository_owner }}/litomi-cataloger
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate cataloger image metadata
        id: metadata_cataloger
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_CATALOGER }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish cataloger image
        id: build_cataloger_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/cataloger/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata_cataloger.outputs.tags }}
          labels: ${{ steps.metadata_cataloger.outputs.labels }}

  build-and-publish-recommender-image:
    name: Build and publish recommender image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build_recommender_image.outputs.digest }}
    env:
      IMAGE_RECOMMENDER: ghcr.io/${{ github.repository_owner }}/litomi-recommender
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate recommender image metadata
        id: metadata_recommender
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_RECOMMENDER }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish recommender image
        id: build_recommender_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/recommender/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata_recommender.outputs.tags }}
          labels: ${{ steps.metadata_recommender.outputs.labels }}

  propose-ops-production-image-digests:
    name: Propose ops production image digests
    if: ${{ github.ref_name == 'main' }}
    needs:
      - build-and-publish-web-image
      - build-and-publish-api-image
      - build-and-publish-cataloger-image
      - build-and-publish-recommender-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      OPS_REPOSITORY: ${{ github.repository_owner }}/litomi-ops
      OPS_PATH: litomi-ops
      OPS_WEB_OVERLAY_FILE: k8s/workload/litomi/prod/web/kustomization.yaml
      OPS_API_OVERLAY_FILE: k8s/workload/litomi/prod/api/kustomization.yaml
      IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/litomi-web
      IMAGE_API: ghcr.io/${{ github.repository_owner }}/litomi-api
      IMAGE_WEB_DIGEST: ${{ needs.build-and-publish-web-image.outputs.digest }}
      IMAGE_API_DIGEST: ${{ needs.build-and-publish-api-image.outputs.digest }}
    steps:
      - name: Generate litomi-ops GitHub App token
        id: ops_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OPS_REPO_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_REPO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: litomi-ops
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout litomi-ops main branch
        uses: actions/checkout@v6
        with:
          repository: ${{ env.OPS_REPOSITORY }}
          token: ${{ steps.ops_app_token.outputs.token }}
          path: ${{ env.OPS_PATH }}
          fetch-depth: 0
          ref: main

      - name: Update litomi-ops production image digests
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          def update_image_digest(path: Path, image_name: str, digest: str) -> None:
              if not digest.startswith("sha256:"):
                  raise SystemExit(f"Invalid digest for {image_name}: {digest}")

              lines = path.read_text().splitlines(keepends=True)
              start = next((index for index, line in enumerate(lines) if line.strip() == f"- name: {image_name}"), None)
              if start is None:
                  raise SystemExit(f"Failed to find image entry for {image_name} in {path}")

              child_indent = lines[start].split("-", 1)[0] + "  "
              end = next(
                  (index for index in range(start + 1, len(lines)) if lines[index].strip().startswith("- name: ")),
                  len(lines),
              )

              for index in range(start + 1, end):
                  if lines[index].lstrip().startswith(("digest:", "newTag:")):
                      lines[index] = f"{child_indent}digest: {digest}\n"
                      path.write_text("".join(lines))
                      return

              insert_at = next(
                  (index + 1 for index in range(start + 1, end) if lines[index].lstrip().startswith("newName:")),
                  start + 1,
              )

              lines.insert(insert_at, f"{child_indent}digest: {digest}\n")
              path.write_text("".join(lines))

          ops_path = Path(os.environ["OPS_PATH"])
          updates = [
              (
                  Path(os.environ["OPS_WEB_OVERLAY_FILE"]),
                  os.environ["IMAGE_WEB"],
                  os.environ["IMAGE_WEB_DIGEST"],
              ),
              (
                  Path(os.environ["OPS_API_OVERLAY_FILE"]),
                  os.environ["IMAGE_API"],
                  os.environ["IMAGE_API_DIGEST"],
              ),
          ]

          for relative_path, image_name, digest in updates:
              if not digest:
                  raise SystemExit(f"Missing digest for {image_name}")
              update_image_digest(ops_path / relative_path, image_name, digest)
          PY

      - name: Create or update litomi-ops production promotion PR
        id: create_production_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.ops_app_token.outputs.token }}
          path: ${{ env.OPS_PATH }}
          add-paths: |
            ${{ env.OPS_WEB_OVERLAY_FILE }}
            ${{ env.OPS_API_OVERLAY_FILE }}
          branch: codex/litomi-production-image-digests
          delete-branch: true
          commit-message: 'chore(k8s): promote litomi image digests'
          title: 'chore(k8s): promote production image digests'
          body: |
            This PR updates litomi production manifests to the latest immutable image digests built from `litomi` `main`.

            - Web: `${{ env.IMAGE_WEB }}@${{ env.IMAGE_WEB_DIGEST }}`
            - API: `${{ env.IMAGE_API }}@${{ env.IMAGE_API_DIGEST }}`
            - Source commit: `${{ github.sha }}`
            - Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          base: main

      - name: Report production promotion PR
        if: ${{ steps.create_production_pr.outputs.pull-request-url }}
        shell: bash
        run: |
          echo "Created or updated production promotion PR: ${{ steps.create_production_pr.outputs.pull-request-url }}"
