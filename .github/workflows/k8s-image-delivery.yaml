name: Kubernetes Image Delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubernetes-image-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish-web-image:
    name: Build and publish web image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build_web_image.outputs.digest }}
    env:
      IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/litomi-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Load public web build arguments from overlay
        id: load_public_env
        shell: bash
        run: |
          set -euo pipefail
          public_env_file="apps/web/public.env"

          if [ ! -f "$public_env_file" ]; then
            echo "public.env not found: $public_env_file" >&2
            exit 1
          fi

          tmp="$(mktemp)"
          while IFS= read -r line; do
            if [[ "$line" =~ ^(#|[[:space:]]*$) ]]; then
              continue
            fi

            if [[ ! "$line" =~ ^NEXT_PUBLIC_[A-Z0-9_]+=.*$ ]]; then
              echo "public.env must contain only NEXT_PUBLIC_* assignments, blank lines, or comments." >&2
              echo "$line" >&2
              exit 1
            fi

            printf '%s\n' "$line" >> "$tmp"
          done < "$public_env_file"

          if [ ! -s "$tmp" ]; then
            echo "No NEXT_PUBLIC_* entries found in $public_env_file" >&2
            exit 1
          fi

          echo "build_args<<EOF" >> "$GITHUB_OUTPUT"
          cat "$tmp" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate web image metadata
        id: metadata_web
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web image
        id: build_web_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            CI=true
            COMMIT_SHA=${{ github.sha }}
            ${{ steps.load_public_env.outputs.build_args }}
          secrets: |
            APP_POSTGRES_URL=${{ secrets.APP_POSTGRES_URL }}
            "APP_POSTGRES_CERTIFICATE=${{ secrets.APP_POSTGRES_CERTIFICATE }}"
            CATALOG_POSTGRES_URL=${{ secrets.CATALOG_POSTGRES_URL }}
            "CATALOG_POSTGRES_CERTIFICATE=${{ secrets.CATALOG_POSTGRES_CERTIFICATE }}"
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: ${{ steps.metadata_web.outputs.tags }}
          labels: ${{ steps.metadata_web.outputs.labels }}

  build-and-publish-api-image:
    name: Build and publish api image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build_api_image.outputs.digest }}
    env:
      IMAGE_API: ghcr.io/${{ github.repository_owner }}/litomi-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate api image metadata
        id: metadata_api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish api image
        id: build_api_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: ${{ steps.metadata_api.outputs.tags }}
          labels: ${{ steps.metadata_api.outputs.labels }}

  build-and-publish-cataloger-image:
    name: Build and publish cataloger image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build_cataloger_image.outputs.digest }}
    env:
      IMAGE_CATALOGER: ghcr.io/${{ github.repository_owner }}/litomi-cataloger
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate cataloger image metadata
        id: metadata_cataloger
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_CATALOGER }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish cataloger image
        id: build_cataloger_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/cataloger/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata_cataloger.outputs.tags }}
          labels: ${{ steps.metadata_cataloger.outputs.labels }}

  build-and-publish-notifier-image:
    name: Build and publish notifier image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build_notifier_image.outputs.digest }}
    env:
      IMAGE_NOTIFIER: ghcr.io/${{ github.repository_owner }}/litomi-notifier
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate notifier image metadata
        id: metadata_notifier
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NOTIFIER }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish notifier image
        id: build_notifier_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/notifier/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata_notifier.outputs.tags }}
          labels: ${{ steps.metadata_notifier.outputs.labels }}

  build-and-publish-recommender-image:
    name: Build and publish recommender image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build_recommender_image.outputs.digest }}
    env:
      IMAGE_RECOMMENDER: ghcr.io/${{ github.repository_owner }}/litomi-recommender
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate recommender image metadata
        id: metadata_recommender
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_RECOMMENDER }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish recommender image
        id: build_recommender_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/recommender/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata_recommender.outputs.tags }}
          labels: ${{ steps.metadata_recommender.outputs.labels }}

  build-and-publish-chat-image:
    name: Build and publish chat image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build_chat_image.outputs.digest }}
    env:
      IMAGE_CHAT: ghcr.io/${{ github.repository_owner }}/litomi-chat
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate chat image metadata
        id: metadata_chat
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_CHAT }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish chat image
        id: build_chat_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/chat/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata_chat.outputs.tags }}
          labels: ${{ steps.metadata_chat.outputs.labels }}

  build-and-publish-chat-worker-image:
    name: Build and publish chat-worker image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build_chat_worker_image.outputs.digest }}
    env:
      IMAGE_CHAT_WORKER: ghcr.io/${{ github.repository_owner }}/litomi-chat-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate chat-worker image metadata
        id: metadata_chat_worker
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_CHAT_WORKER }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish chat-worker image
        id: build_chat_worker_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/chat-worker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata_chat_worker.outputs.tags }}
          labels: ${{ steps.metadata_chat_worker.outputs.labels }}

  build-and-publish-chat-push-image:
    name: Build and publish chat-push image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build_chat_push_image.outputs.digest }}
    env:
      IMAGE_CHAT_PUSH: ghcr.io/${{ github.repository_owner }}/litomi-chat-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate chat-push image metadata
        id: metadata_chat_push
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_CHAT_PUSH }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish chat-push image
        id: build_chat_push_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/chat-push/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata_chat_push.outputs.tags }}
          labels: ${{ steps.metadata_chat_push.outputs.labels }}

  # ops 디지스트 승격(propose-ops) 작업에는 넣지 않는다(k8s 대상이 아님).
  build-and-publish-edge-proxy-image:
    name: Build and publish edge-proxy image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build_edge_proxy_image.outputs.digest }}
    env:
      IMAGE_EDGE_PROXY: ghcr.io/${{ github.repository_owner }}/litomi-edge-proxy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate edge-proxy image metadata
        id: metadata_edge_proxy
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_EDGE_PROXY }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish edge-proxy image
        id: build_edge_proxy_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/edge-proxy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.metadata_edge_proxy.outputs.tags }}
          labels: ${{ steps.metadata_edge_proxy.outputs.labels }}

  # edge-proxy를 Cloud Run에 배포한다(방금 빌드한 GHCR 이미지를 digest로 고정해 immutable 배포).
  # 선행조건(미설정 시 작업 자동 skip): GCP Workload Identity Federation + 아래 repo vars.
  #   vars.GCP_WORKLOAD_IDENTITY_PROVIDER, vars.GCP_DEPLOY_SERVICE_ACCOUNT, vars.GCP_PROJECT_ID
  # 배포 SA 권한: roles/run.admin + roles/iam.serviceAccountUser. (README "Cloud Run 배포 작업" 참고)
  deploy-edge-proxy-cloud-run:
    name: Deploy edge-proxy to Cloud Run
    if: ${{ github.ref_name == 'main' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
    needs: build-and-publish-edge-proxy-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_EDGE_PROXY: ghcr.io/${{ github.repository_owner }}/litomi-edge-proxy
      SERVICE_FILE: apps/edge-proxy/cloudrun/service.yaml
      REGION: asia-northeast3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Pin built image digest into service manifest
        env:
          DIGEST: ${{ needs.build-and-publish-edge-proxy-image.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ ! "${DIGEST}" == sha256:* ]]; then
            echo "Invalid image digest: ${DIGEST}" >&2
            exit 1
          fi

          IMAGE_REF="${IMAGE_EDGE_PROXY}@${DIGEST}"
          IMAGE_REF="${IMAGE_REF}" yq -i \
            '.spec.template.spec.containers[0].image = strenv(IMAGE_REF)' "${SERVICE_FILE}"
          echo "Deploying image: ${IMAGE_REF}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run services replace "${SERVICE_FILE}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${REGION}" \
            --quiet

  propose-ops-production-image-digests:
    name: Propose ops production image digests
    if: ${{ github.ref_name == 'main' }}
    needs:
      - build-and-publish-web-image
      - build-and-publish-api-image
      - build-and-publish-cataloger-image
      - build-and-publish-notifier-image
      - build-and-publish-recommender-image
      - build-and-publish-chat-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      OPS_REPOSITORY: ${{ github.repository_owner }}/litomi-ops
      OPS_PATH: litomi-ops
      OPS_WEB_OVERLAY_FILE: k8s/workload/litomi/prod/web/kustomization.yaml
      OPS_API_OVERLAY_FILE: k8s/workload/litomi/prod/api/kustomization.yaml
      OPS_CATALOGER_OVERLAY_FILE: k8s/workload/litomi/prod/cataloger/kustomization.yaml
      OPS_NOTIFIER_OVERLAY_FILE: k8s/workload/litomi/prod/notifier/kustomization.yaml
      OPS_CHAT_OVERLAY_FILE: k8s/workload/litomi/prod/chat/kustomization.yaml
      IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/litomi-web
      IMAGE_API: ghcr.io/${{ github.repository_owner }}/litomi-api
      IMAGE_CATALOGER: ghcr.io/${{ github.repository_owner }}/litomi-cataloger
      IMAGE_NOTIFIER: ghcr.io/${{ github.repository_owner }}/litomi-notifier
      IMAGE_CHAT: ghcr.io/${{ github.repository_owner }}/litomi-chat
      IMAGE_WEB_DIGEST: ${{ needs.build-and-publish-web-image.outputs.digest }}
      IMAGE_API_DIGEST: ${{ needs.build-and-publish-api-image.outputs.digest }}
      IMAGE_CATALOGER_DIGEST: ${{ needs.build-and-publish-cataloger-image.outputs.digest }}
      IMAGE_NOTIFIER_DIGEST: ${{ needs.build-and-publish-notifier-image.outputs.digest }}
      IMAGE_CHAT_DIGEST: ${{ needs.build-and-publish-chat-image.outputs.digest }}
    steps:
      - name: Generate litomi-ops GitHub App token
        id: ops_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OPS_REPO_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_REPO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: litomi-ops
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout litomi-ops main branch
        uses: actions/checkout@v6
        with:
          repository: ${{ env.OPS_REPOSITORY }}
          token: ${{ steps.ops_app_token.outputs.token }}
          path: ${{ env.OPS_PATH }}
          fetch-depth: 0
          ref: main

      - name: Update litomi-ops production image digests
        shell: bash
        run: |
          set -euo pipefail

          set_digest() {
            local file="$1" image="$2" digest="$3"

            if [[ ! "${digest}" == sha256:* ]]; then
              echo "Invalid digest for ${image}: ${digest}" >&2
              exit 1
            fi

            local matches
            matches="$(IMAGE="${image}" yq '[(.images // [])[] | select(.name == strenv(IMAGE))] | length' "${file}")"

            if [[ "${matches}" != "1" ]]; then
              echo "Expected exactly 1 image named ${image} in ${file}, found ${matches}" >&2
              exit 1
            fi

            IMAGE="${image}" DIGEST="${digest}" yq -i \
              '(.images[] | select(.name == strenv(IMAGE)) | .digest) = strenv(DIGEST)' "${file}"
          }

          set_digest "${OPS_PATH}/${OPS_WEB_OVERLAY_FILE}" "${IMAGE_WEB}" "${IMAGE_WEB_DIGEST}"
          set_digest "${OPS_PATH}/${OPS_API_OVERLAY_FILE}" "${IMAGE_API}" "${IMAGE_API_DIGEST}"
          set_digest "${OPS_PATH}/${OPS_CATALOGER_OVERLAY_FILE}" "${IMAGE_CATALOGER}" "${IMAGE_CATALOGER_DIGEST}"
          set_digest "${OPS_PATH}/${OPS_NOTIFIER_OVERLAY_FILE}" "${IMAGE_NOTIFIER}" "${IMAGE_NOTIFIER_DIGEST}"
          set_digest "${OPS_PATH}/${OPS_CHAT_OVERLAY_FILE}" "${IMAGE_CHAT}" "${IMAGE_CHAT_DIGEST}"

      - name: Create or update litomi-ops production promotion PR
        id: create_production_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.ops_app_token.outputs.token }}
          path: ${{ env.OPS_PATH }}
          add-paths: |
            ${{ env.OPS_WEB_OVERLAY_FILE }}
            ${{ env.OPS_API_OVERLAY_FILE }}
            ${{ env.OPS_CATALOGER_OVERLAY_FILE }}
            ${{ env.OPS_NOTIFIER_OVERLAY_FILE }}
            ${{ env.OPS_CHAT_OVERLAY_FILE }}
          branch: codex/litomi-production-image-digests
          delete-branch: true
          commit-message: 'chore(k8s): promote litomi image digests'
          title: 'chore(k8s): promote production image digests'
          body: |
            This PR updates litomi production manifests to the latest immutable image digests built from `litomi` `main`.

            - Web: `${{ env.IMAGE_WEB }}@${{ env.IMAGE_WEB_DIGEST }}`
            - API: `${{ env.IMAGE_API }}@${{ env.IMAGE_API_DIGEST }}`
            - Cataloger: `${{ env.IMAGE_CATALOGER }}@${{ env.IMAGE_CATALOGER_DIGEST }}`
            - Notifier: `${{ env.IMAGE_NOTIFIER }}@${{ env.IMAGE_NOTIFIER_DIGEST }}`
            - Chat: `${{ env.IMAGE_CHAT }}@${{ env.IMAGE_CHAT_DIGEST }}`
            - Source commit: `${{ github.sha }}`
            - Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          base: main

      - name: Report production promotion PR
        if: ${{ steps.create_production_pr.outputs.pull-request-url }}
        shell: bash
        run: |
          echo "Created or updated production promotion PR: ${{ steps.create_production_pr.outputs.pull-request-url }}"
