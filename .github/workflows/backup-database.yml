name: Database Backup

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BACKUP_PREFIX: litomi
      BACKUP_DIR: backups

    steps:
      - name: Generate timestamp
        id: timestamp
        run: echo "date=$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Create and encrypt backup
        env:
          APP_POSTGRES_URL: ${{ secrets.APP_POSTGRES_URL }}
          APP_POSTGRES_CERTIFICATE: ${{ secrets.APP_POSTGRES_CERTIFICATE }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          DATE: ${{ steps.timestamp.outputs.date }}
        run: |
          # 1. Prepare environment
          FILENAME="${BACKUP_PREFIX}-${DATE}"
          DUMP_FILE="${BACKUP_DIR}/${FILENAME}.dump"
          ENCRYPTED_FILE="${BACKUP_DIR}/${FILENAME}.dump.gpg"
          CERT_FILE="${BACKUP_DIR}/db-cert.crt"

          mkdir -p "${BACKUP_DIR}"
          echo "$APP_POSTGRES_CERTIFICATE" > "${CERT_FILE}"

          # 2. Dump database using PostgreSQL 18 Docker image
          echo "Starting pg_dump..."
          docker run --rm \
            -v "$(pwd)/${BACKUP_DIR}:/backups" \
            -e APP_POSTGRES_URL="$APP_POSTGRES_URL" \
            -e PGSSLMODE="verify-full" \
            -e PGSSLROOTCERT="/backups/db-cert.crt" \
            postgres:18-alpine \
            sh -c "pg_dump \"\$APP_POSTGRES_URL\" \
              --no-owner \
              --no-privileges \
              --no-comments \
              --format=custom \
              --compress=9 \
              --file=\"/backups/${FILENAME}.dump\""

          # 3. Encrypt the backup with extreme GPG settings
          echo "Encrypting backup..."
          gpg --batch --yes \
            --passphrase "$BACKUP_ENCRYPTION_KEY" \
            --symmetric \
            --cipher-algo AES256 \
            --s2k-mode 3 \
            --s2k-count 65011712 \
            --s2k-digest-algo SHA512 \
            --output "${ENCRYPTED_FILE}" \
            "${DUMP_FILE}"

          # 4. Cleanup unencrypted dump and cert immediately to prevent leaks
          rm -f "${DUMP_FILE}" "${CERT_FILE}"

          # 5. Generate checksum for integrity verification
          echo "Generating checksum..."
          cd "${BACKUP_DIR}" && sha256sum "$(basename "${ENCRYPTED_FILE}")" > "$(basename "${ENCRYPTED_FILE}").sha256"

          # 6. Display artifacts size
          ls -lh

      - name: Upload backup to GitHub Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BACKUP_PREFIX }}-backup-${{ steps.timestamp.outputs.date }}
          path: ${{ env.BACKUP_DIR }}/
          retention-days: 7
          if-no-files-found: error
