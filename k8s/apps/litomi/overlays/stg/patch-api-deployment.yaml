apiVersion: apps/v1
kind: Deployment
metadata:
  name: litomi-api
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: 40m
              memory: 960Mi
            limits:
              cpu: 500m
              memory: 1088Mi
          env:
            - name: APP_POSTGRES_APPLICATION_NAME
              value: litomi-api-stg
            - name: APP_POSTGRES_POOL_MAX
              value: '1'
            - name: CATALOG_POSTGRES_APPLICATION_NAME
              value: litomi-api-stg-catalog
            - name: CATALOG_POSTGRES_POOL_MAX
              value: '1'
