apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: litomi-stg

resources:
  - ../../base
  - hpa-backend.yaml
  - hpa-web.yaml
  - namespace.yaml
  - serviceaccount-eso-vault.yaml
  - secretstore-vault.yaml
  - externalsecret-litomi-backend-secret.yaml
  - ingress.yaml
  - workload-identity-template/serviceaccount-backend-google-auth.yaml
  - workload-identity-template/configmap-backend-google-credentials.yaml

patches:
  - path: patch-backend-deployment.yaml
  - path: patch-web-deployment.yaml
  - path: workload-identity-template/patch-backend-deployment-google-auth.yaml

configMapGenerator:
  - name: litomi-public-env
    envs:
      - public.env.kv

  - name: litomi-common-env
    literals:
      - APP_ENV=stg
      - APP_ORIGIN=https://stg.litomi.in
      - REDIS_URL=redis://redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://opentelemetry-collector.tracing.svc:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=0.3
      - OTEL_PROPAGATORS=tracecontext,baggage
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=litomi,deployment.environment=stg,k8s.cluster.name=litomi-k3s
      - IMAGE_PROXY_UPSTREAM_PROXY_URL=http://litomi-image-egress-proxy:8080
      - IMAGE_PROXY_UPSTREAM_PROXY_HOST_SUFFIXES=k-hentai.org
images:
  - name: litomi-web
    newName: ghcr.io/litomi2026/litomi-web
    digest: sha256:51c922ef9c15e25f2cac6b4e801c65b2a1a265bac66b605b784aae11a0bcdba2
  - name: litomi-backend
    newName: ghcr.io/litomi2026/litomi-backend
    digest: sha256:bec4b43a87bf6accf4e35c180b91e5f52c7065d27e0af4db4a2b8ee0986a77d4
  - name: litomi-spoofdpi
    newName: ghcr.io/litomi2026/litomi-spoofdpi
    digest: sha256:f71c433a44508801768ae2f7ea974825b2cd6fe8fb8c6279f4054ede8f44e3ac
