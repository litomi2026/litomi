apiVersion: apps/v1
kind: Deployment
metadata:
  name: litomi-web
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      containers:
        - name: web
          resources:
            requests:
              cpu: 40m
              memory: 480Mi
            limits:
              cpu: 500m
              memory: 544Mi
          env:
            - name: APP_POSTGRES_APPLICATION_NAME
              value: litomi-web-stg
            - name: APP_POSTGRES_POOL_MAX
              value: '1'
            - name: CATALOG_POSTGRES_APPLICATION_NAME
              value: litomi-web-stg-catalog
            - name: CATALOG_POSTGRES_POOL_MAX
              value: '1'
