apiVersion: apps/v1
kind: Deployment
metadata:
  name: litomi-image-egress-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litomi-image-egress-proxy
  template:
    metadata:
      labels:
        app: litomi-image-egress-proxy
    spec:
      automountServiceAccountToken: false
      containers:
        - name: spoofdpi
          image: litomi-spoofdpi:prod
          imagePullPolicy: IfNotPresent
          args:
            - --app-mode
            - http
            - --listen-addr
            - 0.0.0.0:8080
            - --https-split-mode
            - sni
            - --log-level
            - info
            - --silent
          ports:
            - name: http-proxy
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: litomi-image-egress-proxy
spec:
  selector:
    app: litomi-image-egress-proxy
  ports:
    - name: http-proxy
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litomi-image-egress-proxy-ingress
spec:
  podSelector:
    matchLabels:
      app: litomi-image-egress-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: litomi-backend
      ports:
        - protocol: TCP
          port: 8080
