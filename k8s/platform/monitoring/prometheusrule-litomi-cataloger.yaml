apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: litomi-cataloger
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/instance: kube-prometheus-stack
spec:
  groups:
    - name: litomi.cataloger
      rules:
        - alert: LitomiCatalogerJobFailed
          expr: |
            kube_job_failed{namespace="litomi-prod", condition="true"}
              * on (namespace, job_name) group_left(owner_name)
                kube_job_owner{namespace="litomi-prod", owner_kind="CronJob", owner_name="litomi-cataloger", owner_is_controller="true"}
              > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Litomi cataloger job failed
            description: The latest litomi-cataloger CronJob execution failed after Kubernetes retries.
        - alert: LitomiCatalogerLastSuccessStale
          expr: |
            (
              time() - kube_cronjob_status_last_successful_time{namespace="litomi-prod", cronjob="litomi-cataloger"} > 93600
            )
            or
            (
              time() - kube_cronjob_created{namespace="litomi-prod", cronjob="litomi-cataloger"} > 93600
              unless kube_cronjob_status_last_successful_time{namespace="litomi-prod", cronjob="litomi-cataloger"}
            )
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Litomi cataloger has not succeeded recently
            description: litomi-cataloger has not recorded a successful CronJob run for more than 26 hours.
        - alert: LitomiCatalogerSuspended
          expr: kube_cronjob_spec_suspend{namespace="litomi-prod", cronjob="litomi-cataloger"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Litomi cataloger CronJob is suspended
            description: litomi-cataloger is suspended and will not run on its 21:00 UTC schedule.
